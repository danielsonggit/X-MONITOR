version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/adapters/sqlite/migrations"
    queries: "internal/adapters/sqlite/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/adapters/sqlite/sqlcgen"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
